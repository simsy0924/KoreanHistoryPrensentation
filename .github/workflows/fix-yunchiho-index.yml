name: Fix Yunchiho index section

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start_marker = '<section class="slide" data-title="윤치호 일기로 보는 독립협회의 희망과 균열">'
          end_marker = '<section class="slide" data-title="기대는 왜 균열로 바뀌었나?">'

          if start_marker not in text or end_marker not in text:
              raise SystemExit('target section markers not found')

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          def one(pattern, default=''):
              m = re.search(pattern, block, re.S)
              return m.group(1).strip() if m else default

          def two(pattern, default1='', default2=''):
              m = re.search(pattern, block, re.S)
              return (m.group(1).strip(), m.group(2).strip()) if m else (default1, default2)

          kicker = one(r'<div class="kicker">(.*?)</div>', '사료 강화 · 윤치호 일기')
          title = one(r'<h2>(.*?)</h2>', '윤치호 일기로 보는 독립협회의 희망과 균열')
          lead = one(r'<p class="lead">(.*?)</p>', '윤치호 일기는 독립협회를 향한 기대, 절차적 개혁 의지, 대중과의 거리, 외세에 대한 불안, 실패 이후의 좌절을 함께 보여주는 자료입니다.')

          quote1 = one(r'<h3>절차로 움직인 반외세 운동</h3><p class="quote">(.*?)</p>')
          body1 = one(r'<h3>절차로 움직인 반외세 운동</h3><p class="quote">.*?</p><p>(.*?)</p>')

          quote2 = one(r'<h3>헌의 6조를 밀어붙인 정치적 기대</h3><p class="quote">(.*?)</p>')
          body2 = one(r'<h3>헌의 6조를 밀어붙인 정치적 기대</h3><p class="quote">.*?</p><p>(.*?)</p>')
          route2_title, route2_body = two(r'<h3>헌의 6조를 밀어붙인 정치적 기대</h3>.*?<div class="route"><strong>(.*?)</strong>(.*?)</div>', '해석', '황제의 권위를 활용해 개혁을 제도화하려 한 현실적 전략과 한계가 함께 드러납니다.')

          quote3 = one(r'<h3>대한의 마지막 희망이라는 절박함</h3><p class="quote">(.*?)</p>')
          body3 = one(r'<h3>대한의 마지막 희망이라는 절박함</h3><p class="quote">.*?</p><p>(.*?)</p>')
          route3_title, route3_body = two(r'<h3>대한의 마지막 희망이라는 절박함</h3>.*?<div class="route"><strong>(.*?)</strong>(.*?)</div>', '해석', '자주독립 의식과 시대적 불안이 함께 드러납니다.')

          def tags(items):
              return '<div class="diary-tags">' + ''.join(f'<span class="tag">{x}</span>' for x in items) + '</div>'

          section = f'''<section class="slide" data-title="윤치호 일기로 보는 독립협회의 희망과 균열"><div class="wrap"><div class="kicker">{kicker}</div><h2>{title}</h2><p class="lead">{lead}</p><div class="cols3"><article class="paper diary-card"><div class="diary-meta"><strong>1. 1898-03-03</strong><span>국역 윤치호 영문 일기 5</span></div><h3>절차로 움직인 반외세 운동</h3><p class="quote">{quote1}</p><p>{body1}</p><p class="pq">독립협회의 반외세 운동은 감정적 저항이었을까, 절차를 갖춘 정치 운동이었을까?</p>{tags(['절차적 반외세','사실 확인','여론 정치','외세 견제'])}</article><article class="paper diary-card"><div class="diary-meta"><strong>2. 1898-10-31</strong><span>국역 윤치호 영문 일기 5</span></div><h3>헌의 6조를 밀어붙인 정치적 기대</h3><p class="quote">{quote2}</p><p>{body2}</p><div class="route"><strong>{route2_title}</strong>{route2_body}</div><p class="pq">황제권을 활용한 개혁 추진은 현실적 전략이었을까, 독립협회의 한계였을까?</p>{tags(['황제권','헌의 6조','개혁 전략','제도화'])}</article><article class="paper diary-card"><div class="diary-meta"><strong>3. 1898-11-05</strong><span>국역 윤치호 영문 일기 5</span></div><h3>대한의 마지막 희망이라는 절박함</h3><p class="quote">{quote3}</p><p>{body3}</p><div class="route"><strong>{route3_title}</strong>{route3_body}</div><p class="pq">독립협회를 마지막 희망으로 본 절박함은 자주독립 의식인가, 시대적 불안의 표현인가?</p>{tags(['희망과 불안','자주독립','외세 개입','정치 위기'])}</article></div><div class="next"><button class="main" data-next>다음: 기대와 균열 →</button></div></div></section>\n'''

          new_text = text[:start] + section + text[end:]
          workflow = Path('.github/workflows/fix-yunchiho-index.yml')
          if workflow.exists():
              workflow.unlink()
          path.write_text(new_text, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html .github/workflows/fix-yunchiho-index.yml
            git commit -m "Fix Yunchiho diary section in index"
            git push
          else
            echo "No changes to commit"
          fi
